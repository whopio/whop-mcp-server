# Safety classification for every mutating public operation.
#
# Rules are evaluated top to bottom; the FIRST match wins. GET operations are
# always read_only and never consult this file. A non-GET operation that
# matches no rule is NOT exposed as a tool: the generator drops it into
# manifest.meta.pendingReview until someone classifies it here. Surfaced by
# `whop mcp doctor` and `pnpm generate:summary`.
#
# Matchers (any combination; all present matchers must match):
#   operations: exact "METHOD /path" keys
#   tags:       OpenAPI tag names
#   methods:    HTTP methods
# Settings:
#   classification: mutating | destructive
#   financial / credential / externalPublication: booleans (default false)
#   idempotency: none | supported | required (default none)
#   confirmation: boolean (default false)

rules:
  # ── Pure calculations exposed as POST — no side effects ──────────────────
  - name: quotes-and-calculations
    match:
      operations:
        - POST /swaps/quote
        - POST /plans/{id}/calculate_tax
        - POST /ad_groups/estimate_reach
    set:
      classification: read_only

  # ── Payout quotes create a short-lived provider draft, but move no funds ─
  - name: payout-quotes
    match:
      operations:
        - POST /payouts/quotes
    set:
      classification: mutating
      idempotency: required

  # ── Economic intelligence: queues a generation, or retires a card ────────
  - name: economic-intelligence-writes
    match:
      operations:
        - POST /economic_intelligence
        - PATCH /economic_intelligence/{id}
    set:
      classification: mutating

  # ── Money movement: always prepare/confirm + idempotency ─────────────────
  - name: money-movement
    match:
      operations:
        - POST /payments
        - POST /payments/{id}/refund
        - POST /payments/{id}/retry
        - POST /payments/{id}/void
        - POST /payments/{id}/capture
        - POST /waitlist_entries/{id}/approve
        - POST /waitlist_entries/approve_all
        - POST /payouts
        - POST /transfers
        - POST /swaps
        - POST /deposits
        - POST /topups
        - POST /company_token_transactions
        - POST /invoices/{id}/mark_paid
        - POST /invoices/{id}/mark_uncollectible
        - POST /invoices/{id}/void
        - POST /ad_campaigns/{id}/retry_payment
        - POST /bounties
        - POST /bounties/{id}/cancel
    set:
      classification: mutating
      financial: true
      idempotency: required
      confirmation: true

  # ── Payout cancel: returns funds to the balance. Naturally idempotent —
  #    repeat cancels answer 200 with the payout unchanged — so no key. ─────
  - name: payout-cancel
    match:
      operations:
        - POST /payouts/{id}/cancel
    set:
      classification: mutating
      financial: true
      confirmation: true

  # ── Financial configuration ───────────────────────────────────────────────
  - name: financial-configuration
    match:
      operations:
        - POST /cards
        - PATCH /cards/{id}
        - PATCH /cashback_rules/{id}
        - POST /fee_markups
        - POST /memberships/{id}/extend
        - POST /payouts/methods
        - PATCH /payouts/methods/{id}
        - POST /media/generate
        - POST /payment_method_domains
        - POST /payment_method_domains/{id}/verify
    set:
      classification: mutating
      financial: true
      confirmation: true

  - name: partner-referral-request-acceptance
    match:
      operations:
        - POST /partner_referral_requests/{id}/accept
    set:
      classification: mutating
      financial: true
      idempotency: required
      confirmation: true

  - name: partner-referral-request-creation
    match:
      operations:
        - POST /partner_referral_requests
    set:
      classification: mutating
      idempotency: supported

  - name: partner-referral-request-decisions
    match:
      operations:
        - POST /partner_referral_requests/{id}/cancel
        - POST /partner_referral_requests/{id}/decline
    set:
      classification: mutating
      idempotency: supported
      confirmation: true

  - name: cashback-rule-creation
    match:
      operations:
        - POST /cashback_rule
    set:
      classification: mutating
      financial: true
      idempotency: required
      confirmation: true

  - name: payment-return-url
    match:
      operations:
        - PATCH /payments/{payment_id}/return_url
    set:
      classification: mutating
      financial: true
      externalPublication: true
      idempotency: none
      confirmation: true

  # ── Resume a renewal parked on a bank challenge: charges the saved card.
  #    Naturally idempotent — a live attempt or paid receipt answers 200 with
  #    the current status and mints nothing — so no key. ─────────────────────
  - name: payment-resume
    match:
      operations:
        - POST /payments/{payment_id}/resume
    set:
      classification: mutating
      financial: true
      confirmation: true

  - name: setup-intent-creation
    match:
      operations:
        - POST /setup_intents
    set:
      classification: mutating
      financial: true
      externalPublication: true
      idempotency: none
      confirmation: true

  - name: setup-intent-return-url
    match:
      operations:
        - PATCH /setup_intents/{setup_intent_id}/return_url
    set:
      classification: mutating
      financial: true
      externalPublication: true
      idempotency: none
      confirmation: true

  - name: financial-deletes
    match:
      operations:
        - DELETE /fee_markups/{id}
    set:
      classification: destructive
      financial: true
      confirmation: true

  # ── Credential and key material ───────────────────────────────────────────
  - name: credential-creation
    match:
      operations:
        - POST /access_tokens
    set:
      classification: mutating
      credential: true
      confirmation: true

  - name: api-key-writes
    match:
      tags: [API Keys]
      methods: [post, patch]
    set:
      classification: mutating
      credential: true
      confirmation: true

  - name: api-key-delete
    match:
      tags: [API Keys]
      methods: [delete]
    set:
      classification: destructive
      credential: true
      confirmation: true

  - name: webhook-endpoint-writes
    match:
      tags: [Webhooks]
      methods: [post, patch]
    set:
      classification: mutating
      credential: true
      confirmation: true

  - name: webhook-endpoint-delete
    match:
      tags: [Webhooks]
      methods: [delete]
    set:
      classification: destructive
      credential: true
      confirmation: true

  # ── Payment rules decide whether a payment is allowed, so weakening one needs a confirm ──
  - name: payment-rule-weakening
    match:
      operations:
        - DELETE /payment_rules/{id}
    set:
      classification: destructive
      confirmation: true

  - name: payment-rule-deactivate
    match:
      operations:
        - POST /payment_rules/{id}/deactivate
    set:
      classification: mutating
      confirmation: true

  - name: payment-rule-writes
    match:
      tags: [Payment Rules]
      methods: [post, patch]
    set:
      classification: mutating
      idempotency: supported

  # ── High-impact membership and dispute actions ────────────────────────────
  - name: membership-consequential
    match:
      operations:
        - POST /memberships/{id}/cancel
        - POST /memberships/{id}/pause
        - POST /memberships/{id}/transfer
    set:
      classification: mutating
      confirmation: true

  - name: membership-restorative
    match:
      operations:
        - POST /memberships/{id}/resume
        - POST /memberships/{id}/resync_access
        - PATCH /memberships/{id}
    set:
      classification: mutating

  - name: dispute-evidence
    match:
      operations:
        - POST /disputes/{id}/upload_evidence
        - PATCH /disputes/{id}
        - POST /disputes/{id}/submit
    set:
      classification: mutating
      confirmation: true

  # ── Resolution center: accepting a buyer claim generally refunds money ────
  - name: resolution-center-accept
    match:
      operations:
        - POST /resolution_center_cases/{id}/accept
    set:
      classification: mutating
      financial: true
      idempotency: required
      confirmation: true

  - name: resolution-center-decisions
    match:
      operations:
        - POST /resolution_center_cases/{id}/deny
        - POST /resolution_center_cases/{id}/appeal
        - POST /resolution_center_cases/{id}/withdraw
    set:
      classification: mutating
      confirmation: true

  - name: resolution-center-routine
    match:
      tags: [Resolution Center Cases]
      methods: [post, patch]
    set:
      classification: mutating

  # ── Team access grants dashboard permissions ──────────────────────────────
  - name: team-member-access
    match:
      tags: [Team Members]
      methods: [post, patch]
    set:
      classification: mutating
      confirmation: true

  # ── App builds: promote changes what runs for end users ───────────────────
  - name: app-build-promote
    match:
      operations:
        - POST /app_builds/{id}/promote
    set:
      classification: mutating
      confirmation: true

  # ── Deploying an app: builds the working copy and, unless draft, promotes it
  # ── to production — the same end effect as app-build-promote ──────────────
  - name: app-deployment
    match:
      operations:
        - POST /apps/{id}/deploy
    set:
      classification: mutating
      confirmation: true
      idempotency: supported

  - name: experiment-creation
    match:
      operations:
        - POST /experiments
    set:
      classification: mutating
      idempotency: supported

  - name: experiment-serving
    match:
      operations:
        - PATCH /experiments/{id}
        - POST /experiments/{id}/activate
        - POST /experiments/{id}/end
        - POST /experiments/{id}/pause
    set:
      classification: mutating
      confirmation: true

  - name: domain-publication
    match:
      operations:
        - PATCH /domains/{id}
        - POST /domains
    set:
      classification: mutating
      externalPublication: true
      confirmation: true
      idempotency: supported

  # ── Exports produce files of data the credential can already read ─────────
  - name: data-exports
    match:
      operations:
        - POST /exports
    set:
      classification: mutating

  # ── Notifications push to end users ──────────────────────────────────────
  - name: notification-blast
    match:
      operations:
        - POST /notifications
    set:
      classification: mutating
      externalPublication: true
      confirmation: true

  # Marks the caller's own notifications read — no reach beyond the caller.
  - name: notification-acknowledgement
    match:
      operations:
        - POST /notifications/mark_read
    set:
      classification: mutating
      idempotency: supported

  - name: membership-invitations
    match:
      operations:
        - POST /memberships/invite
    set:
      classification: mutating
      externalPublication: true
      confirmation: true

  # ── Community content: publishes externally but routine ──────────────────
  - name: community-publishing
    match:
      tags:
        - Messages
        - Forum posts
        - Forums
        - Reactions
        - Social Accounts
      methods: [post, patch]
    set:
      classification: mutating
      externalPublication: true

  - name: reaction-delete
    match:
      operations:
        - DELETE /reactions/{id}
    set:
      classification: mutating

  - name: ad-conversion-value-rule-delete
    match:
      operations:
        - DELETE /ad_conversion_value_rules/{id}
    set:
      classification: destructive
      idempotency: supported
      confirmation: true

  # ── All remaining deletes are destructive and confirmed ──────────────────
  - name: destructive-deletes
    match:
      methods: [delete]
    set:
      classification: destructive
      confirmation: true

  # ── Ordinary resource writes ──────────────────────────────────────────────
  # This tag list is the reviewed vocabulary: a write under a tag not listed
  # here (and not matched above) stays in pendingReview until someone adds it.
  - name: ordinary-writes
    match:
      tags:
        - Access tokens
        - Account links
        - Accounts
        - Ad Campaigns
        - Ad Conversion Value Rules
        - Ad Groups
        - Ads
        - Affiliates
        - Ai chats
        - App Builds
        - Apps
        - Audiences
        - Authorized users
        - Bounties
        - Bounty Submissions
        - Chat channels
        - Checkout Configurations
        - Course chapters
        - Course lessons
        - Courses
        - Dm channels
        - Dm members
        - Events
        - Experiences
        - Files
        - Identity profiles
        - Invoices
        - Leads
        - Media
        - Partners
        - Plans
        - Products
        - Promo Codes
        - Shipments
        - Support channels
        - Users
        - Verifications
        - Waitlist Entries
    set:
      classification: mutating
      idempotency: supported
